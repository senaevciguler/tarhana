    <div class="bg-white dark:bg-zinc-900 rounded-2xl shadow-sm overflow-hidden p-8">
      <div class="mb-10">
        <h2 class="text-xl font-bold mb-4">Order Summary</h2>
        <div class="flex justify-between items-center py-4 border-b border-slate-100 dark:border-slate-800">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-slate-50 dark:bg-zinc-800 rounded-lg flex items-center justify-center p-2">
              <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjaTiPnsI61uxKff57YDNfgbjKDiWdMvFSHp0jX89oKuyxARwdGUeaFVPAWipDO8AZCXPFZTgCSDLtbRfoqGoiORYn7peqxl_PglDuZBacidPiGJCRC7ov0OphhkiXL6jhaNCyEH4zP-6VVMnatWTt8hpUOuwl3or9mNCE3KM9hCRenphP_WIu02VBMBbfOaCcNA0W-lpjMQIF85vKOllNwl7Ccdi6GD9XKP4icgl5SbtA84lV6wClevwqpw6fghO3Nlo36Evs4Wk" alt="Product" class="w-full h-full object-contain">
            </div>
            <div>
              <p class="font-bold">The Classic Tarhana</p>
              <p class="text-sm text-slate-500">1 unit</p>
            </div>
          </div>
          <p class="font-bold">129 kr</p>
        </div>
        <div class="flex justify-between items-center py-6">
          <p class="text-xl font-bold">Total</p>
          <p class="text-xl font-bold text-primary">129 kr</p>
        </div>
      </div>

      <form class="space-y-6">
        <div>
          <h2 class="text-xl font-bold mb-4">Shipping Information</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">First Name</label>
              <input type="text" class="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-zinc-800 focus:ring-2 focus:ring-primary outline-none transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Last Name</label>
              <input type="text" class="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-zinc-800 focus:ring-2 focus:ring-primary outline-none transition-all">
            </div>
          </div>
          <div class="mt-4">
            <label class="block text-sm font-medium mb-1">Address</label>
            <input type="text" class="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-zinc-800 focus:ring-2 focus:ring-primary outline-none transition-all">
          </div>
        </div>

        <button type="button" class="w-full py-4 bg-primary text-white rounded-lg font-bold hover:bg-red-700 transition-all text-lg shadow-lg shadow-primary/20">
          Complete Purchase
        </button>

        <div class="text-center">
          <a routerLink="/products" class="text-sm text-slate-500 hover:text-primary transition-colors">
            Return to shop
