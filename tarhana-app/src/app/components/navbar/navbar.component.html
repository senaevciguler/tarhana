<nav class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    <a class="flex items-center gap-3 cursor-pointer" routerLink="/">
      <div class="bg-[#23452E] text-white rounded-lg w-8 h-8 flex items-center justify-center font-serif text-xl font-bold shadow-sm">
        E
      </div>
      <span class="font-display font-bold text-xl tracking-tight dark:text-white">Ella’s Pantry</span>
    </a>
    <div class="hidden md:flex items-center gap-8 font-medium">
      <a
        class="hover:text-primary transition-colors cursor-pointer dark:text-stone-300 dark:hover:text-primary"
        routerLink="/products"
        routerLinkActive="text-primary font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        >{{ 'NAV_PRODUCTS' | translate }}</a
      >
      <a
        class="hover:text-primary transition-colors cursor-pointer dark:text-stone-300 dark:hover:text-primary"
        routerLink="/recipes"
        routerLinkActive="text-primary font-bold"
        >{{ 'NAV_RECIPES' | translate }}</a
      >
      <a
        class="hover:text-primary transition-colors cursor-pointer dark:text-stone-300 dark:hover:text-primary"
        routerLink="/story"
        routerLinkActive="text-primary font-bold"
        >{{ 'NAV_STORY' | translate }}</a
      >
      <a
        class="hover:text-primary transition-colors cursor-pointer dark:text-stone-300 dark:hover:text-primary"
        routerLink="/contact"
        routerLinkActive="text-primary font-bold"
        >{{ 'NAV_CONTACT' | translate }}</a
      >
    </div>
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2 text-sm font-bold dark:text-white">
        <button
          (click)="setLanguage('SV')"
          [class.text-primary]="langService.language() === 'SV'"
          [class.opacity-50]="langService.language() !== 'SV'"
          class="hover:text-primary transition-all"
        >
          SV
        </button>
        <span class="opacity-20">|</span>
        <button
          (click)="setLanguage('EN')"
          [class.text-primary]="langService.language() === 'EN'"
          [class.opacity-50]="langService.language() !== 'EN'"
          class="hover:text-primary transition-all"
        >
          EN
        </button>
      </div>

      <!-- Cart Button -->
      <button
        (click)="toggleCart()"
        class="relative p-2 text-slate-700 dark:text-white hover:text-primary dark:hover:text-primary transition-colors group"
      >
        <span class="material-icons text-2xl" aria-hidden="true">shopping_bag</span>
        @if (cartService.itemCount() > 0) {
          <span
            class="absolute top-0 right-0 w-5 h-5 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white dark:border-background-dark group-hover:scale-110 transition-transform"
          >
            {{ cartService.itemCount() }}
          </span>
        }
      </button>
    </div>
  </div>
</nav>

<app-cart-drawer></app-cart-drawer>
