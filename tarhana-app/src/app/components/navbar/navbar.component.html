<nav class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    <a class="flex items-center gap-2 cursor-pointer" routerLink="/">
      <div class="w-10 h-10 bg-primary rounded flex items-center justify-center text-white">
        <span class="material-icons">grain</span>
      </div>
      <span class="font-display font-bold text-xl tracking-tight dark:text-white">MODERN TARHANA</span>
    </a>
    <div class="hidden md:flex items-center gap-8 font-medium">
      <a
        class="hover:text-primary transition-colors cursor-pointer dark:text-stone-300 dark:hover:text-primary"
        routerLink="/products"
        routerLinkActive="text-primary font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        >{{ 'NAVBAR.PRODUCTS' | translate }}</a
      >
      <a
        class="hover:text-primary transition-colors cursor-pointer dark:text-stone-300 dark:hover:text-primary"
        routerLink="/recipes"
        routerLinkActive="text-primary font-bold"
        >{{ 'NAVBAR.RECIPES' | translate }}</a
      >
      <a
        class="hover:text-primary transition-colors cursor-pointer dark:text-stone-300 dark:hover:text-primary"
        routerLink="/story"
        routerLinkActive="text-primary font-bold"
        >{{ 'NAVBAR.STORY' | translate }}</a
      >
      <a
        class="hover:text-primary transition-colors cursor-pointer dark:text-stone-300 dark:hover:text-primary"
        routerLink="/health"
        routerLinkActive="text-primary font-bold"
        >{{ 'NAVBAR.HEALTH' | translate }}</a
      >
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 text-sm font-bold dark:text-stone-300">
        <button
          (click)="switchLanguage('sv')"
          [class.text-primary]="currentLang() === 'sv'"
          class="hover:text-primary transition-colors"
        >
          SV
        </button>
        <span class="text-stone-300">|</span>
        <button
          (click)="switchLanguage('en')"
          [class.text-primary]="currentLang() === 'en'"
          class="hover:text-primary transition-colors"
        >
          EN
        </button>
      </div>
    </div>
  </div>
</nav>
